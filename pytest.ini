[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto
addopts = -ra -q --strict-markers
markers =
    tier1: Tier 1 - Feature functional coverage tests
    tier2: Tier 2 - Boundary, adversarial, and corner case tests
    tier3: Tier 3 - Cross-feature pairwise combination tests
    tier4: Tier 4 - Real-world application workload tests
    r1: Requirement 1 - Face identification & feature processing
    r2: Requirement 2 - Search provenance engine & fallback
    r3: Requirement 3 - Match validation & similarity ranking
    r4: Requirement 4 - Evidence collection & canonical hashing
    r5: Requirement 5 - Blockchain integrity layer & smart contract
    r6: Requirement 6 - Independent verification & 5-scenario tamper detection
    r7: Requirement 7 - Pipeline orchestration & demo mode
    r8: Requirement 8 - Privacy, security & ethical guardrails
    e2e: End-to-end integration tests
    contract: Smart contract and EVM blockchain tests
    hashing: Cryptographic hashing and canonicalization tests
