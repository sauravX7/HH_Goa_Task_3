[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hh_goa_face_provenance"
version = "0.1.0"
description = "Automated Face Provenance, Match Validation & Blockchain Integrity Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "setuptools<70",
    "cmake",
    "dlib",
    "face-recognition",
    "face-recognition-models",
    "opencv-python-headless",
    "numpy<2.0.0",
    "pillow",
    "web3>=6.0.0",
    "eth-account>=0.10.0",
    "py-solc-x>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "playwright>=1.43.0",
    "google-search-results>=2.4.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
face-provenance = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
